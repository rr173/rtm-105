version: '3.8'

services:
  backend:
    build: ./backend
    container_name: workflow-backend
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - DB_PATH=/app/data/workflow.db

  frontend:
    image: nginx:alpine
    container_name: workflow-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
